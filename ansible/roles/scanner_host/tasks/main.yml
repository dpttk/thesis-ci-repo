---
- name: Install BCC tools and libbpfcc
  ansible.builtin.apt:
    name:
      - bpfcc-tools
      - libbpfcc
      - python3-bpfcc
    state: present
    update_cache: true

- name: Install AppArmor utilities
  ansible.builtin.apt:
    name:
      - apparmor
      - apparmor-utils
    state: present

- name: Install build deps for oci-seccomp-bpf-hook
  ansible.builtin.apt:
    name:
      - build-essential
      - git
      - clang
      - llvm
      - libelf-dev
      - libbpf-dev
      - libbpfcc-dev
      - libseccomp-dev
      - linux-tools-common
      - linux-tools-generic
      - golang-go
      - pkg-config
    state: present
    update_cache: true

- name: Stat oci-seccomp-bpf-hook binary
  ansible.builtin.stat:
    path: /usr/local/libexec/oci/hooks.d/oci-seccomp-bpf-hook
  register: oci_hook_bin

- name: Clone oci-seccomp-bpf-hook source
  ansible.builtin.git:
    repo: https://github.com/containers/oci-seccomp-bpf-hook.git
    dest: /opt/oci-seccomp-bpf-hook
    version: "{{ oci_hook_version | default('main') }}"
    force: true
  when: not oci_hook_bin.stat.exists

- name: Build oci-seccomp-bpf-hook (binary only, skip docs)
  ansible.builtin.command: make binary
  args:
    chdir: /opt/oci-seccomp-bpf-hook
    creates: /opt/oci-seccomp-bpf-hook/bin/oci-seccomp-bpf-hook
  environment:
    PATH: "/usr/local/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    GO: /usr/local/go/bin/go
  when: not oci_hook_bin.stat.exists

- name: Ensure hooks.d directory exists
  ansible.builtin.file:
    path: /usr/local/libexec/oci/hooks.d
    state: directory
    mode: "0755"

- name: Install oci-seccomp-bpf-hook binary
  ansible.builtin.copy:
    src: /opt/oci-seccomp-bpf-hook/bin/oci-seccomp-bpf-hook
    dest: /usr/local/libexec/oci/hooks.d/oci-seccomp-bpf-hook
    mode: "0755"
    remote_src: true
  when: not oci_hook_bin.stat.exists

- name: AppArmor smoke status
  ansible.builtin.command: aa-status
  register: aa_status
  changed_when: false
  failed_when: false

- name: Show AppArmor status
  ansible.builtin.debug:
    var: aa_status.stdout_lines

- name: Deploy dummy AppArmor profile (warmup)
  ansible.builtin.copy:
    dest: /etc/apparmor.d/runc-ci-warmup
    mode: "0644"
    content: |
      #include <tunables/global>
      profile runc-ci-warmup flags=(complain) {
        #include <abstractions/base>
      }

- name: Warmup load/unload of dummy AppArmor profile
  ansible.builtin.shell: |
    set -e
    apparmor_parser -r /etc/apparmor.d/runc-ci-warmup
    apparmor_parser -R /etc/apparmor.d/runc-ci-warmup
  changed_when: false
  failed_when: false

- name: Ensure bpf filesystem is mounted
  ansible.posix.mount:
    path: /sys/fs/bpf
    src: bpffs
    fstype: bpf
    state: mounted
    opts: defaults
  failed_when: false

- name: Install Docker engine (used by prepare-bundle.sh kind=docker-export)
  ansible.builtin.apt:
    name: docker.io
    state: present
    update_cache: true

- name: Enable and start docker service
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started
