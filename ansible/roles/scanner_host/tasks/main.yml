---
# Provision the self-hosted runner for runc --security-scan.
#
# Most of the apt / eBPF / AppArmor / cgroup / bpffs / scan-user setup
# is delegated to script/setup-scan-host.sh from the runc fork itself,
# so a hand-provisioned host and an Ansible-provisioned host stay
# bit-for-bit identical. Anything CI-specific (oci-seccomp-bpf-hook
# build, Docker for bundle prep) lives below the script call.

- name: Upload setup-scan-host.sh from local runc checkout
  ansible.builtin.copy:
    src: "{{ runc_fork_local_checkout }}/script/setup-scan-host.sh"
    dest: /usr/local/sbin/runc-setup-scan-host.sh
    mode: "0755"
  when: runc_fork_local_checkout | length > 0

- name: Fetch setup-scan-host.sh from runc fork on github
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/{{ runc_fork_repo }}/{{ runc_fork_ref }}/script/setup-scan-host.sh"
    dest: /usr/local/sbin/runc-setup-scan-host.sh
    mode: "0755"
    force: true
  when: runc_fork_local_checkout | length == 0

- name: Run runc setup-scan-host.sh
  ansible.builtin.command: /usr/local/sbin/runc-setup-scan-host.sh
  environment:
    SCAN_USER: "{{ runc_scan_user }}"
    SCAN_UID: "{{ runc_scan_uid }}"
    SCAN_GID: "{{ runc_scan_uid }}"
  register: scan_setup
  # The script always installs/checks; treat "host is ready" tail as
  # the success marker. We do not try to be clever about "changed":
  # apt and bpffs lines are explicit enough in the recorded output.
  changed_when: "'host is ready for runc --security-scan' in scan_setup.stdout"
  failed_when: scan_setup.rc != 0

- name: Show setup-scan-host.sh output
  ansible.builtin.debug:
    var: scan_setup.stdout_lines

# --- oci-seccomp-bpf-hook ----------------------------------------------------
# Not part of setup-scan-host.sh because it is a separate upstream
# project; we still need it for the seccomp side of the scan.

- name: Stat oci-seccomp-bpf-hook binary
  ansible.builtin.stat:
    path: /usr/local/libexec/oci/hooks.d/oci-seccomp-bpf-hook
  register: oci_hook_bin

- name: Clone oci-seccomp-bpf-hook source
  ansible.builtin.git:
    repo: https://github.com/containers/oci-seccomp-bpf-hook.git
    dest: /opt/oci-seccomp-bpf-hook
    version: "{{ oci_hook_version }}"
    force: true
  when: not oci_hook_bin.stat.exists

- name: Build oci-seccomp-bpf-hook (binary only, skip docs)
  ansible.builtin.command: make binary
  args:
    chdir: /opt/oci-seccomp-bpf-hook
    creates: /opt/oci-seccomp-bpf-hook/bin/oci-seccomp-bpf-hook
  environment:
    PATH: "/usr/local/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    GO: /usr/local/go/bin/go
  when: not oci_hook_bin.stat.exists

- name: Ensure hooks.d directory exists
  ansible.builtin.file:
    path: /usr/local/libexec/oci/hooks.d
    state: directory
    mode: "0755"

- name: Install oci-seccomp-bpf-hook binary
  ansible.builtin.copy:
    src: /opt/oci-seccomp-bpf-hook/bin/oci-seccomp-bpf-hook
    dest: /usr/local/libexec/oci/hooks.d/oci-seccomp-bpf-hook
    mode: "0755"
    remote_src: true
  when: not oci_hook_bin.stat.exists

# --- Docker (bundle prep) ----------------------------------------------------

- name: Install Docker engine (used by prepare-bundle.sh kind=docker-export)
  ansible.builtin.apt:
    name: docker.io
    state: present
    update_cache: true

- name: Enable and start docker service
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started
