name: juice-shop
description: >
  OWASP Juice Shop as a realistic Node.js workload. Runs with host
  networking so the e2e probe (scripts/run-scan.sh drives it) can reach
  127.0.0.1:3000 while runc --security-scan is live. Graceful SIGTERM
  after the probe lets the scanner finalize seccomp + capabilities +
  apparmor profiles.

rootfs:
  kind: docker-export
  image: bkimminich/juice-shop:latest

config:
  template: ../templates/hostnet.config.json
  process:
    args:
      - "/nodejs/bin/node"
      - "/juice-shop/build/app.js"
    env:
      - "NODE_ENV=ci"
      - "PATH=/nodejs/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    cwd: "/juice-shop"
    terminal: false
    user:
      uid: 0
      gid: 0

scan:
  seccomp_hook: auto
  capable: auto
  duration_sec: 90
  probe_script: tests/e2e_probe.sh
  probe_ready_timeout_sec: 180
  grace_term_sec: 15

tests: []

expect:
  profiles:
    seccomp_min_syscalls: 30
    apparmor_has_include: true
    capabilities_contains:
      - CAP_NET_BIND_SERVICE
